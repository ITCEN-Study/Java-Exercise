<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자바스크립트 실습(3)</title>
    <style>
        h1 { color: blue; }
    </style>
</head>
<body>
    <h1>자바스크립트 실습(3)</h1>
    <hr>

    <script>
        var input = window.prompt("숫자를 입력하세요.");

        if (input === null || input === "") {
            document.write("<h3>비어있는 입력</h3>");
        } 
        else if (isNaN(input)) {
            document.write("<h3>숫자가 아닌 입력</h3>");
        } 
        else {
            var num = parseInt(input);
            console.log("입력된 숫자 : " + num);

            var sum = 0;
            for (var i = 1; i <= num; i++) {
                sum += i;
            }
            document.write("<h2>1부터 " + num + " 까지의 합은 " + sum + " 입니다.</h2>");
        }
    </script>
</body>
</html>
