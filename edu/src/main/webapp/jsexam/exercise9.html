<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>exercise9</title>
</head>
<body>
    <script>
        function printH1(content) {
            document.write("<h1>" + content + "</h1>");
        }

        function printH4(content) {
            document.write("<h4>" + content + "</h4>");
        }

        function apply(arr, callback) {
            if (!Array.isArray(arr) || typeof callback !== 'function') {
                console.log("아규먼트 오류");
                return false;
            }

            for (let i = 0; i < arr.length; i++) {
                callback(arr[i]);
            }
            return true;
        }

        let dataArray = []; 

        while (true) {
            let input = window.prompt("데이터를 입력하세요");
            if (input === null) break; 
            dataArray.push(input);
        }

        let randomNum = Math.floor(Math.random() * 10) + 1;
        console.log("추출된 난수 : " + randomNum);

        let result;

        if ([1, 4, 6].includes(randomNum)) {
            result = apply(dataArray, printH1);
        } else if ([3, 5, 7].includes(randomNum)) {
            result = apply(dataArray, printH4);
        } else if (randomNum === 8 || randomNum === 9) {
            result = apply("ㅋㅋ", printH1);
        } else {
            result = apply(dataArray);
        }

        if (result) {
            window.alert("처리 성공");
        } else {
            window.alert("처리 실패");
        }
    </script>
</body>
</html>
