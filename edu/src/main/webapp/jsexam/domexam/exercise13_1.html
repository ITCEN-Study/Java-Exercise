<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>exercise13_1</title>
</head>
<body>
    <h1>이벤트 모델-인라인</h1>
    <button onclick="changeColor('red')">빨강색</button>
    <button onclick="changeColor('blue')">파랑색</button>
    <button onclick="changeColor('yellow')">노랑색</button>
    <h3 id="dateMsg"></h3>

    <script>
        const dateMsg = document.getElementById("dateMsg");
        const today = new Date();
        dateMsg.textContent = "오늘은 " + (today.getMonth() + 1) + "월 " + today.getDate() + "일입니다";

        function changeColor(color) {
            dateMsg.style.color = color;
        }
    </script>
</body>
</html>
