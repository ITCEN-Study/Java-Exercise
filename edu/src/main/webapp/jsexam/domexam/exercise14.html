<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이벤트 처리 실습</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Noto Sans KR', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 50px;
        background-color: #ffffff;
    }

    h1 {
        font-family: 'Black Han Sans', sans-serif;
        font-size: 3rem;
        color: #4a148c;
        text-shadow: 3px 3px 5px rgba(74, 20, 140, 0.3);
        margin-bottom: 30px;
    }

    hr {
        width: 80%;
        border: 0;
        height: 1px;
        background: #ccc;
        margin: 20px 0;
    }

    .button-container {
        border: 2px solid #4a148c;
        border-radius: 20px;
        padding: 30px 60px;
        box-shadow: 8px 8px 0px #4a148c;
        display: flex;
        gap: 15px;
        margin: 20px 0;
    }

    button {
        background-color: #212121;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s;
    }

    button:active {
        transform: scale(0.95);
    }

    #display {
        margin-top: 30px;
        min-height: 200px;
    }

    #display img {
        width: 150px;
        height: auto;
    }
</style>
</head>
<body>

    <h1>이벤트 처리 실습</h1>
    
    <hr>

    <section class="button-container" id="container">
        <button data-img="sun.png">맑음</button>
        <button data-img="cloud.png">흐림</button>
        <button data-img="rain.png">비</button>
    </section>

    <hr>

    <div id="display"></div>

    <script>
        const container = document.getElementById('container');
        const display = document.getElementById('display');
        const imgPath = "/edu/images/";

        function handleClick(event) {
            if (event.target.tagName === 'BUTTON') {
                const fileName = event.target.getAttribute('data-img');
                display.innerHTML = `<img src="${imgPath}${fileName}" alt="${event.target.textContent}">`;
            }
        }

        container.addEventListener('click', handleClick);
    </script>
</body>
</html>
