<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Insert title here</title>
  <style>
    h2 {
      text-shadow: 3px 3px 5px gray;
      color: darkblue;
    }
    input {
      border-radius: 10px;
      border: 1px solid #ccc;
      padding: 5px;
      margin-bottom: 8px;
    }
    input[type="submit"], input[type="reset"] {
      background-color: lightsteelblue;
      cursor: pointer;
    }
  </style>
</head>
<body>
<h2>회원 정보를 입력하십시오.</h2>
<hr>
<form>
  이름: <input type="text" placeholder="이름을 입력하세요"><br>
  전화번호: <input type="tel" placeholder="전화번호를 입력하세요"><br>
  계정: <input type="text" placeholder="계정을 입력하세요"><br>
  패스워드: <input type="password" placeholder="패스워드를 입력하세요"><br>
  <input type="submit" value="등록">
  <input type="reset" value="재작성">
</form>
</body>
</html>
