<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
    body {
        text-align: center;
    }

    .title-box {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 300px;
        height: 100px;
        margin: 20px auto;
        border-radius: 15px;
        background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
        color: white;
        font-size: 24px;
        font-weight: bold;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(3, 160px);
        gap: 20px;
        justify-content: center;
        margin-top: 20px;
    }

    .img-box {
        width: 150px;
        height: 150px;
        border: 2px solid pink; 
        box-shadow: 10px 10px 20px pink;
        overflow: hidden;
        opacity: 1.0;
        transition: opacity 0.3s;
    }

    .img-box img {
        width: 100%;
        height: 100%;
        display: block;
    }

    .img-box:hover {
        opacity: 0.3;
    }
</style>
</head>
<body>

    <div class="title-box">
        날씨의 종류
    </div>

    <hr>

    <div class="gallery">
        <div class="img-box"><img src="../images/sun.png" alt="sun"></div>
        <div class="img-box"><img src="../images/rain.png" alt="rain"></div>
        <div class="img-box"><img src="../images/cloud.png" alt="cloud"></div>
        <div class="img-box"><img src="../images/cloud_sun.png" alt="cloud_sun"></div>
        <div class="img-box"><img src="../images/snow.png" alt="snow"></div>
        <div class="img-box"><img src="../images/etc.png" alt="etc"></div>
    </div>

</body>
</html>
